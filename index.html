<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>YATO Bot</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      background:#0d0d0d;
      color:white;
      font-family:Arial, sans-serif;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .container{
      text-align:center;
      background:#161616;
      padding:50px;
      border-radius:25px;
      width:90%;
      max-width:500px;
      box-shadow:0 0 30px rgba(88,101,242,0.25);
    }

    h1{
      font-size:42px;
      margin-bottom:15px;
      color:#5865F2;
    }

    p{
      color:#b5b5b5;
      margin-bottom:35px;
    }

    .buttons{
      display:flex;
      gap:15px;
      justify-content:center;
      flex-wrap:wrap;
    }

    a{
      text-decoration:none;
    }

    button{
      background:#5865F2;
      color:white;
      border:none;
      padding:15px 25px;
      border-radius:14px;
      font-size:16px;
      cursor:pointer;
      transition:0.2s;
    }

    button:hover{
      transform:scale(1.05);
      background:#4752c4;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>YATO Bot</h1>

    <p>
      Official website for YATO Discord Bot
    </p>

    <div class="buttons">

      <a href="./narox-policy.html">
        <button>Privacy Policy</button>
      </a>

      <a href="./terms.html">
        <button>Terms of Service</button>
      </a>

      <a href="./owner.html">
        <button>Owner</button>
      </a>

    </div>
  </div>

</body>
</html>
