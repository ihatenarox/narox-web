<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>NAROX Owner</title>

  <style>

    *{

      margin:0;
      padding:0;
      box-sizing:border-box;

    }

    body{

      background:
      linear-gradient(
        135deg,
        #050816,
        #0f172a
      );

      min-height:100vh;

      display:flex;
      justify-content:center;
      align-items:center;

      overflow:hidden;

      font-family:
      Arial,
      sans-serif;

      color:white;

    }

    /* ========================= */
    /* BACKGROUND GLOW */
    /* ========================= */

    body::before{

      content:"";

      position:absolute;

      width:600px;
      height:600px;

      background:
      rgba(88,101,242,0.12);

      border-radius:50%;

      top:-200px;
      right:-200px;

      filter:blur(40px);

    }

    body::after{

      content:"";

      position:absolute;

      width:500px;
      height:500px;

      background:
      rgba(14,165,233,0.08);

      border-radius:50%;

      bottom:-220px;
      left:-220px;

      filter:blur(40px);

    }

    /* ========================= */
    /* CARD */
    /* ========================= */

    .card{

      position:relative;

      width:90%;
      max-width:520px;

      padding:45px;

      border-radius:28px;

      background:
      rgba(255,255,255,0.04);

      border:
      1px solid
      rgba(255,255,255,0.06);

      backdrop-filter:
      blur(14px);

      overflow:hidden;

      text-align:center;

      box-shadow:
      0 0 40px
      rgba(88,101,242,0.22);

      transition:
      0.35s ease;

      z-index:2;

    }

    .card:hover{

      transform:
      translateY(-8px);

      box-shadow:
      0 0 60px
      rgba(88,101,242,0.35);

    }

    /* ========================= */
    /* CARD LIGHT */
    /* ========================= */

    .card::before{

      content:"";

      position:absolute;

      width:320px;
      height:320px;

      background:
      rgba(88,101,242,0.12);

      border-radius:50%;

      top:-140px;
      right:-140px;

      filter:blur(10px);

    }

    /* ========================= */
    /* AVATAR */
    /* ========================= */

    .avatar{

      width:135px;
      height:135px;

      border-radius:50%;

      object-fit:cover;

      border:
      4px solid #5865F2;

      margin-bottom:22px;

      box-shadow:
      0 0 25px
      rgba(88,101,242,0.45);

      transition:
      0.35s ease;

      position:relative;
      z-index:2;

    }

    .avatar:hover{

      transform:
      scale(1.05);

    }

    /* ========================= */
    /* TITLE */
    /* ========================= */

    h1{

      font-size:48px;

      color:#5865F2;

      margin-bottom:12px;

      position:relative;
      z-index:2;

    }

    /* ========================= */
    /* BADGE */
    /* ========================= */

    .badge{

      display:inline-block;

      background:
      linear-gradient(
        135deg,
        #5865F2,
        #7289da
      );

      padding:12px 24px;

      border-radius:14px;

      font-size:15px;

      margin-bottom:25px;

      font-weight:bold;

      position:relative;
      z-index:2;

      box-shadow:
      0 0 18px
      rgba(88,101,242,0.3);

    }

    /* ========================= */
    /* DESCRIPTION */
    /* ========================= */

    p{

      color:#c4c4c4;

      line-height:1.8;

      font-size:17px;

      margin-bottom:28px;

      position:relative;
      z-index:2;

    }

    /* ========================= */
    /* DISCORD BOX */
    /* ========================= */

    .discord{

      background:
      rgba(255,255,255,0.04);

      border:
      1px solid
      rgba(255,255,255,0.05);

      padding:16px;

      border-radius:16px;

      font-size:18px;

      margin-bottom:18px;

      position:relative;
      z-index:2;

    }

    strong{

      color:#5865F2;

    }

    /* ========================= */
    /* USER ID */
    /* ========================= */

    .userid{

      color:#8f8f8f;

      font-size:14px;

      position:relative;
      z-index:2;

    }

  </style>

</head>

<body>

  <div class="card">

    <img

      class="avatar"

      src="https://cdn.discordapp.com/avatars/1508150350203584675/ae9741eac8c457654726a06420a4d718.webp?size=4096"

      alt="NAROX Avatar"

    >

    <h1>NAROX</h1>

    <div class="badge">

      Official Owner

    </div>

    <p>

      Developer & owner of NAROX.
      Building advanced Discord systems,
      canvas features, and premium tools.

    </p>

    <div class="discord">

      Discord:
      <strong>ihatenarox</strong>

    </div>

    <div class="userid">

      User ID:
      1025775971699281960

    </div>

  </div>

</body>

</html>
